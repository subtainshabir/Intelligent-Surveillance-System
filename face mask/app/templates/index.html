<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTRY — Facemask Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="page">
    <header class="page-header">
      <span class="brand-mark"></span>
      <div>
        <h1>Facemask Detection</h1>
        <p>Upload an image and run it through the model.</p>
      </div>
    </header>

    <form class="upload-card" action="/predict" method="post" enctype="multipart/form-data" id="upload-form">
      <label class="dropzone" id="dropzone" for="file-input">
        <input type="file" name="file" id="file-input" accept="image/*" required hidden>
        <div class="dropzone-icon">＋</div>
        <div class="dropzone-text">
          <span class="dropzone-title">Drop an image here</span>
          <span class="dropzone-sub">or click to browse — JPG, PNG</span>
        </div>
        <div class="dropzone-filename" id="filename"></div>
      </label>

      <button type="submit" class="submit-button" id="submit-button">
        Run Detection
      </button>
    </form>

    {% if image %}
    <section class="result-card">
      <div class="result-header">
        <h2>Result</h2>
        {% if counts %}
        <div class="result-counts">
          {% for label, count in counts.items() %}
          <span class="count-chip">{{ label }} <b>{{ count }}</b></span>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <div class="result-image-wrap">
        <img src="data:image/jpeg;base64,{{ image }}" alt="Detection result" class="result-image">
      </div>
    </section>
    {% endif %}
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
